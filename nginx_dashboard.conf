server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }

    # Dashboard Panel (Passed to Express to handle Login Page & Sessions)
    location /dashboard/ {
        proxy_pass http://172.18.0.1:9878/;
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://172.18.0.1:9878;
    }

    # Public Hashed Short Links Resolver
    location /r/ {
        proxy_pass http://172.18.0.1:9878;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
