services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    ports:
      - 9091:8080
    environment:
      AUTHENTICATION_API_KEY: arx_evolution_2026
      DATABASE_ENABLED: true
      DATABASE_PROVIDER: postgresql
      DATABASE_USER: evolution_user
      DATABASE_PASSWORD: evo_simple_pass_2026
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: evolution
      DATABASE_SCHEMA: public
      DATABASE_URL: postgresql://evolution_user:evo_simple_pass_2026@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_URI: postgresql://evolution_user:evo_simple_pass_2026@postgres:5432/evolution?schema=public
      CACHE_ENABLED: true
      CACHE_REDIS_ENABLED: false
      LANGUAGE: pt-BR
      LOG_LEVEL: info
      WEBHOOK_ENABLED: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`evolution.arxsolutions.cloud`)"
      - "traefik.http.routers.evolution.entrypoints=https"
      - "traefik.http.routers.evolution.tls.certresolver=letsencrypt"
      - "traefik.http.services.evolution.loadbalancer.server.port=8080"
    extra_hosts:
      - "postgres:172.18.0.2"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - arxstack_default
      - coolify
    restart: unless-stopped

volumes:
  evolution_data:

networks:
  arxstack_default:
    external: true
  coolify:
    external: true
